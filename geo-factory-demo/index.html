<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GEO Factory — пилот для завода ЗАВОД-Х</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Fira+Code:wght@400;500&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #F1F5F9; --panel: #FFFFFF; --panel-2: #F8FAFC; --line: #E2E8F0; --line-strong: #CBD5E1;
  --text: #0F172A; --muted: #64748B; --navy: #1E293B; --navy-text: #E2E8F0; --navy-muted: #94A3B8;
  --accent: #C84F26; --accent-soft: #FBEDE7; --accent-text: #A53F1C;
  --ok: #15803D; --ok-soft: #E7F5EC; --warn: #B45309; --warn-soft: #FEF3C7; --info: #1D4ED8; --info-soft: #E0EAFF;
  --radius: 10px; --shadow: 0 1px 2px rgba(15,23,42,.06), 0 1px 3px rgba(15,23,42,.04);
  --mono: 'Fira Code', ui-monospace, Consolas, monospace;
}
[data-theme="dark"] {
  --bg: #0B0F17; --panel: #131A26; --panel-2: #0F1520; --line: #232D3D; --line-strong: #334155;
  --text: #E5EAF2; --muted: #8B98AC; --navy: #0F1520; --navy-text: #E2E8F0; --navy-muted: #7C8AA0;
  --accent: #E8703F; --accent-soft: #2A1A13; --accent-text: #F29469;
  --ok: #4ADE80; --ok-soft: #10261A; --warn: #FBBF24; --warn-soft: #2A2110; --info: #7AA2FF; --info-soft: #141E36;
  --shadow: none;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { font-family: 'Inter', system-ui, 'Segoe UI', Arial, sans-serif; font-size: 14px; line-height: 1.5; color: var(--text); background: var(--bg); }
button, input, select, textarea { font: inherit; color: inherit; }
a { color: var(--accent-text); }
h1, h2, h3, h4 { margin: 0; line-height: 1.25; }

.app { display: grid; grid-template-columns: 248px minmax(0, 1fr); min-height: 100vh; }
.side { background: var(--navy); color: var(--navy-text); padding: 20px 14px; display: flex; flex-direction: column; gap: 18px; position: sticky; top: 0; height: 100vh; }
.brand { padding: 0 8px; }
.brand b { display: block; font-size: 16px; letter-spacing: .2px; }
.brand span { color: var(--navy-muted); font-size: 12px; }
.nav { display: flex; flex-direction: column; gap: 2px; }
.nav button { all: unset; cursor: pointer; display: flex; align-items: center; gap: 10px; padding: 9px 10px; border-radius: 8px; color: var(--navy-text); font-weight: 500; }
.nav button:hover { background: rgba(255,255,255,.06); }
.nav button.active { background: var(--accent); color: #fff; }
.nav button:focus-visible, .btn:focus-visible, input:focus-visible, select:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.nav .num { font-family: var(--mono); font-size: 11px; opacity: .7; width: 16px; }
.nav .count { margin-left: auto; font-size: 11px; font-family: var(--mono); opacity: .85; }
.side-foot { margin-top: auto; display: flex; flex-direction: column; gap: 8px; }
.side-foot .btn { background: transparent; border-color: rgba(255,255,255,.18); color: var(--navy-text); justify-content: center; }
.side-foot .btn:hover { background: rgba(255,255,255,.08); }
.side-note { font-size: 11px; color: var(--navy-muted); padding: 0 4px; }

.main { padding: 26px 32px 60px; max-width: 1240px; width: 100%; }
.page-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; flex-wrap: wrap; margin-bottom: 18px; }
.page-head h1 { font-size: 22px; font-weight: 700; }
.page-head p { margin: 4px 0 0; color: var(--muted); max-width: 720px; }
.toolbar { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }

.card { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); padding: 18px; }
.card h2 { font-size: 15px; font-weight: 600; margin-bottom: 10px; }
.card + .card { margin-top: 14px; }
.grid > .card { margin-top: 0; }
.grid { display: grid; gap: 14px; }
.g4 { grid-template-columns: repeat(4, minmax(0, 1fr)); }
.g3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.g2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.split { grid-template-columns: 300px minmax(0, 1fr); align-items: start; }
.stack > * + * { margin-top: 14px; }

.kpi { cursor: pointer; text-align: left; border: 1px solid var(--line); background: var(--panel); border-radius: var(--radius); padding: 16px; box-shadow: var(--shadow); }
.kpi:hover { border-color: var(--line-strong); }
.kpi .label { color: var(--muted); font-size: 12px; font-weight: 500; }
.kpi .value { font-size: 26px; font-weight: 700; margin: 4px 0 2px; font-variant-numeric: tabular-nums; }
.kpi .value small { font-size: 14px; font-weight: 500; color: var(--muted); }
.kpi .sub { font-size: 12px; color: var(--muted); }
.meter { height: 6px; border-radius: 3px; background: var(--line); overflow: hidden; margin-top: 10px; }
.meter i { display: block; height: 100%; background: var(--accent); border-radius: 3px; }
.meter.ok i { background: var(--ok); }

.btn { display: inline-flex; align-items: center; gap: 6px; padding: 7px 12px; border-radius: 8px; border: 1px solid var(--line-strong); background: var(--panel); cursor: pointer; font-weight: 500; font-size: 13px; text-decoration: none; color: var(--text); white-space: nowrap; }
.btn:hover { background: var(--panel-2); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
.btn.primary:hover { filter: brightness(1.06); }
.btn.small { padding: 4px 8px; font-size: 12px; }
.btn.ghost { border-color: transparent; background: transparent; color: var(--accent-text); padding-left: 4px; padding-right: 4px; }
.seg { display: inline-flex; border: 1px solid var(--line-strong); border-radius: 8px; overflow: hidden; background: var(--panel); }
.seg button { all: unset; cursor: pointer; padding: 7px 12px; font-size: 13px; font-weight: 500; }
.seg button + button { border-left: 1px solid var(--line-strong); }
.seg button.active { background: var(--navy); color: #fff; }
[data-theme="dark"] .seg button.active { background: var(--accent); }

.badge { display: inline-flex; align-items: center; gap: 5px; padding: 2px 8px; border-radius: 999px; font-size: 11px; font-weight: 600; white-space: nowrap; }
.badge::before { content: ''; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
.badge.demo { background: var(--warn-soft); color: var(--warn); }
.badge.real { background: var(--ok-soft); color: var(--ok); }
.badge.partial, .badge.info { background: var(--info-soft); color: var(--info); }
.badge.neutral { background: var(--line); color: var(--muted); }
.badge.plain::before { display: none; }

.notice { border-radius: var(--radius); padding: 12px 14px; border: 1px solid; display: flex; gap: 12px; align-items: flex-start; justify-content: space-between; flex-wrap: wrap; margin-bottom: 14px; }
.notice.demo { background: var(--warn-soft); border-color: color-mix(in srgb, var(--warn) 35%, transparent); }
.notice.real { background: var(--ok-soft); border-color: color-mix(in srgb, var(--ok) 35%, transparent); }
.notice b { display: block; }
.notice span { color: var(--muted); font-size: 13px; }

input[type="text"], input[type="number"], input[type="search"], select, textarea { border: 1px solid var(--line-strong); background: var(--panel); border-radius: 8px; padding: 7px 10px; min-width: 0; }
input[type="number"] { font-variant-numeric: tabular-nums; }
.field { display: grid; gap: 4px; }
.field label { font-size: 12px; font-weight: 500; color: var(--muted); }
.field .row { display: grid; grid-template-columns: minmax(0, 1fr) 96px; gap: 10px; align-items: center; }
.field .hint { font-size: 11px; color: var(--muted); }
input[type="range"] { width: 100%; accent-color: var(--accent); }

.table-wrap { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-size: 13px; }
th, td { padding: 8px 10px; border-bottom: 1px solid var(--line); text-align: left; vertical-align: middle; }
th { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .4px; color: var(--muted); background: var(--panel-2); white-space: nowrap; }
td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
tr:last-child td { border-bottom: 0; }
td input[type="number"] { width: 88px; text-align: right; padding: 4px 6px; }
td input[type="text"] { width: 100%; padding: 4px 6px; }
td select { padding: 4px 6px; max-width: 100%; }
.bar { display: block; height: 4px; border-radius: 2px; background: var(--accent); opacity: .55; margin-top: 4px; min-width: 2px; }

details.cluster { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); }
details.cluster + details.cluster { margin-top: 10px; }
details.cluster > summary { list-style: none; cursor: pointer; padding: 14px 18px; display: grid; grid-template-columns: minmax(0, 1fr) auto auto; gap: 14px; align-items: center; }
details.cluster > summary::-webkit-details-marker { display: none; }
details.cluster > summary h3 { font-size: 14px; font-weight: 600; }
details.cluster > summary p { margin: 2px 0 0; font-size: 12px; color: var(--muted); }
details.cluster .total { font-size: 18px; font-weight: 700; font-variant-numeric: tabular-nums; text-align: right; }
details.cluster .total small { display: block; font-size: 11px; font-weight: 500; color: var(--muted); }
details.cluster .body { border-top: 1px solid var(--line); }

.funnel { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 8px; }
.funnel .step { background: var(--panel-2); border: 1px solid var(--line); border-radius: 8px; padding: 12px; position: relative; }
.funnel .step b { display: block; font-size: 20px; font-variant-numeric: tabular-nums; }
.funnel .step span { font-size: 12px; color: var(--muted); }
.funnel .step.final { background: var(--accent-soft); border-color: color-mix(in srgb, var(--accent) 40%, transparent); }
.result-big { font-size: 30px; font-weight: 700; font-variant-numeric: tabular-nums; }
.kv { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 6px 16px; font-size: 13px; }
.kv dt { color: var(--muted); } .kv dd { margin: 0; font-weight: 600; text-align: right; font-variant-numeric: tabular-nums; }

.pack-list button { all: unset; cursor: pointer; display: block; width: 100%; box-sizing: border-box; padding: 12px 14px; border: 1px solid var(--line); border-radius: var(--radius); background: var(--panel); margin-bottom: 8px; }
.pack-list button.active { border-color: var(--accent); box-shadow: inset 3px 0 0 var(--accent); }
.pack-list b { display: block; font-size: 13px; }
.pack-list small { color: var(--muted); display: block; margin: 3px 0 8px; }
.tabs { display: flex; gap: 2px; border-bottom: 1px solid var(--line); margin: -4px 0 16px; overflow-x: auto; }
.tabs button { all: unset; cursor: pointer; padding: 8px 12px; font-weight: 500; font-size: 13px; color: var(--muted); border-bottom: 2px solid transparent; white-space: nowrap; }
.tabs button.active { color: var(--text); border-bottom-color: var(--accent); }

.prose { max-width: 760px; font-size: 15px; line-height: 1.65; }
.prose h1 { font-size: 24px; margin: 0 0 14px; } .prose h2 { font-size: 19px; margin: 26px 0 10px; }
.prose h3 { font-size: 16px; margin: 20px 0 8px; } .prose h4 { font-size: 14px; margin: 16px 0 6px; }
.prose p { margin: 0 0 12px; } .prose ul, .prose ol { margin: 0 0 12px; padding-left: 22px; } .prose li { margin-bottom: 4px; }
.prose hr { border: 0; border-top: 1px solid var(--line); margin: 22px 0; }
.prose blockquote { margin: 0 0 12px; padding: 10px 14px; border-left: 3px solid var(--accent); background: var(--panel-2); border-radius: 0 8px 8px 0; }
.prose pre { background: var(--panel-2); border: 1px solid var(--line); border-radius: 8px; padding: 12px; overflow-x: auto; font-family: var(--mono); font-size: 12px; white-space: pre-wrap; }
.prose code { font-family: var(--mono); font-size: .9em; background: var(--panel-2); padding: 1px 4px; border-radius: 4px; }
.prose table { margin-bottom: 14px; font-size: 13px; border: 1px solid var(--line); }
mark.todo { background: var(--warn-soft); color: var(--warn); padding: 1px 5px; border-radius: 4px; font-weight: 600; font-size: .92em; }

.check { display: grid; grid-template-columns: 22px minmax(0, 1fr) auto; gap: 10px; padding: 10px 0; border-bottom: 1px solid var(--line); align-items: start; }
.check:last-child { border-bottom: 0; }
.check .mark { width: 20px; height: 20px; border-radius: 50%; display: grid; place-items: center; font-size: 12px; font-weight: 700; color: #fff; background: var(--ok); }
.check.fail .mark { background: var(--warn); }
.check b { font-weight: 600; } .check p { margin: 2px 0 0; font-size: 12px; color: var(--muted); }
.claim { display: grid; grid-template-columns: 20px minmax(0, 1fr) auto; gap: 10px; padding: 8px 0; border-bottom: 1px solid var(--line); align-items: start; font-size: 13px; }
.claim input { margin-top: 3px; accent-color: var(--ok); }
.claim.done span.t { color: var(--muted); text-decoration: line-through; }
.score { font-size: 34px; font-weight: 700; font-variant-numeric: tabular-nums; }
.score small { font-size: 14px; color: var(--muted); font-weight: 500; }

.step-row { display: grid; grid-template-columns: 28px minmax(0, 1fr) auto; gap: 12px; padding: 12px 0; border-bottom: 1px solid var(--line); align-items: center; }
.step-row:last-child { border-bottom: 0; }
.step-row .n { width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; font-weight: 600; font-size: 12px; background: var(--line); color: var(--muted); }
.step-row.done .n { background: var(--ok); color: #fff; }
.step-row b { font-weight: 600; } .step-row p { margin: 2px 0 0; color: var(--muted); font-size: 13px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chain { display: grid; gap: 4px; max-width: 880px; }
.chain-step { display: grid; grid-template-columns: 34px minmax(0, 1fr); gap: 14px; padding: 14px 0; border-bottom: 1px solid var(--line); }
.chain-step:last-child { border-bottom: 0; }
.chain-num { width: 28px; height: 28px; border-radius: 50%; background: var(--accent); color: #fff; display: grid; place-items: center; font-weight: 700; font-size: 13px; }
.chain-body h3 { font-size: 15px; margin: 2px 0 8px; }
.chain-body p { margin: 0 0 8px; }
.chain-body .table-wrap { overflow-x: auto; }
.chain-body table { font-size: 12.5px; min-width: 0; width: 100%; }
.chain-body th, .chain-body td { padding: 6px 6px; white-space: normal; }
.chain-body td:first-child { min-width: 120px; }
.chain-list { margin: 0 0 8px; padding-left: 20px; } .chain-list li { margin-bottom: 4px; }
.chain-sub { font-size: 12px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; margin: 12px 0 4px; }
.expect { display: grid; gap: 8px; }
.expect > div { padding: 10px 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--panel-2); }
.expect p { margin: 6px 0 0; }
.chain-live { margin-top: 10px; padding: 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--panel-2); }
.chip { font-size: 12px; padding: 3px 8px; border-radius: 6px; background: var(--panel-2); border: 1px solid var(--line); font-family: var(--mono); }
.muted { color: var(--muted); } .small { font-size: 12px; } .right { text-align: right; } .nowrap { white-space: nowrap; }
.empty { text-align: center; padding: 36px 16px; color: var(--muted); }
.toast { position: fixed; bottom: 22px; left: 50%; transform: translateX(-50%); background: var(--navy); color: #fff; padding: 10px 16px; border-radius: 8px; font-size: 13px; box-shadow: 0 8px 24px rgba(0,0,0,.25); z-index: 50; display: none; max-width: 90vw; }
.print-only { display: none; }

@media (max-width: 1080px) {
  .g4 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .g3, .split { grid-template-columns: minmax(0, 1fr); }
  .funnel { grid-template-columns: repeat(2, minmax(0, 1fr)); }
}
@media (max-width: 820px) {
  .app { grid-template-columns: minmax(0, 1fr); }
  .side { position: static; height: auto; padding: 12px; gap: 10px; }
  .nav { flex-direction: row; overflow-x: auto; }
  .nav button { white-space: nowrap; } .nav .count { display: none; }
  .side-foot { flex-direction: row; flex-wrap: wrap; margin-top: 0; } .side-note { display: none; }
  .main { padding: 18px 14px 50px; }
  .g2, .g4 { grid-template-columns: minmax(0, 1fr); }
  details.cluster > summary { grid-template-columns: minmax(0, 1fr) auto; } details.cluster > summary .badge { display: none; }
}
@media print {
  @page { size: A4; margin: 14mm; }
  body { background: #fff; font-size: 11pt; }
  .side, .toolbar, .tabs, .pack-list, .toast, .no-print { display: none !important; }
  .app, .split { display: block; } .main { padding: 0; max-width: none; }
  .card, details.cluster { box-shadow: none; border-color: #bbb; break-inside: avoid; }
  .print-only { display: block; }
  .claim input { appearance: none; width: 12px; height: 12px; border: 1px solid #000; }
  a { color: inherit; text-decoration: none; }
}
</style>
</head>
<body>
<div style="background:#fff4d6;color:#5c4400;padding:8px 16px;font:13px Inter,sans-serif;text-align:center">Обезличенная демонстрационная версия: название завода, сайт, реквизиты и дилеры заменены. Частоты Вордстата и структура замера — реальные.</div>
<div class="app">
  <aside class="side">
    <div class="brand"><b>GEO Factory</b><span>Пилот: завод ЗАВОД-Х</span></div>
    <nav class="nav" id="nav" aria-label="Разделы"></nav>
    <div class="side-foot">
      <button class="btn" data-action="export-state" title="Сохранить введённые частоты, замеры и отметки в файл">Сохранить в файл</button>
      <button class="btn" data-action="import-state" title="Загрузить ранее сохранённый файл">Загрузить из файла</button>
      <button class="btn" data-action="theme" id="themeBtn">Тёмная тема</button>
      <a class="btn" href="guide.html">Инструкция</a>
      <div class="side-note" id="sideNote"></div>
    </div>
  </aside>
  <main class="main" id="main"></main>
</div>
<input type="file" id="fileCsv" accept=".csv,.txt" hidden>
<input type="file" id="fileState" accept=".json" hidden>
<div class="toast" id="toast" role="status"></div>

<script src="factory_data.js"></script>
<script src="app_core.js"></script>
<script src="app.js"></script>
</body>
</html>
